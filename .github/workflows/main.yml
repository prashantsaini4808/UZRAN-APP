name: Build UZRAN Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          mkdir -p public scripts
          if [ -f index.html ] && [ ! -f public/index.html ]; then mv index.html public/index.html; fi
          if [ -f runtime-config.js ] && [ ! -f public/runtime-config.js ]; then mv runtime-config.js public/runtime-config.js; fi
          if [ -f prepare-web.js ] && [ ! -f scripts/prepare-web.js ]; then mv prepare-web.js scripts/prepare-web.js; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packages
        run: npm install

      - name: Build web app
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UZRAN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
